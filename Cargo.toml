[package]
name = "tkc"
version = "0.1.1"
edition = "2021"
description = "A fast terminal todo manager for developers"
license = "MIT"
repository = "https://github.com/TanmayChaurasia24/tkc_cli"
homepage = "https://github.com/TanmayChaurasia24/tkc_cli"
readme = "README.md"
keywords = ["todo", "cli", "productivity", "terminal"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
thiserror = "2.0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4.44"
colored = "3.1.1"
dirs = "6.0.0"
